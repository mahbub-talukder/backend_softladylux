<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#231E1C">
  <div style="background:{{ primary }};color:{{ contrast }};padding:18px 22px;font-size:20px">{{ site.company_name }}</div>
  <div style="padding:22px">
    <p><b>New contact message</b></p>
    <p>From: {{ m.name }} &lt;{{ m.email }}&gt;{% if m.phone %} · {{ m.phone }}{% endif %}<br>Subject: {{ m.subject|default:"(none)" }}</p>
    <p style="white-space:pre-wrap">{{ m.message }}</p>
  </div>
</div>
