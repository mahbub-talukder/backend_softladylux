# Variant for hosting where a provider's proxy / load balancer terminates TLS and forwards plain HTTP
# to this nginx with X-Forwarded-Proto. Use with docker-compose.proxy-tls.yml. This nginx listens on
# HTTP only; it trusts X-Forwarded-Proto from that proxy (so the proxy MUST set it, and nothing else
# may reach this port directly). Django then sees HTTPS and sets HSTS / secure cookies.

gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_min_length 1024;
server_tokens off;

map $http_x_forwarded_proto $sll_proto { default $scheme; https https; }

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 30m;

  error_page 502 503 504 /maintenance.html;
  location = /maintenance.html { root /usr/share/nginx/html; internal; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sll_proto;
    proxy_read_timeout 60s;
  }
  location /static/ { alias /static/; expires 30d; add_header Cache-Control "public, immutable"; }
  location /media/  { alias /media/; expires 30d; add_header Cache-Control "public"; }
  location /_nuxt/  {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sll_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
