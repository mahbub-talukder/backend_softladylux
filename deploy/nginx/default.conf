# Production nginx with TLS terminated here (SRS §9: HTTPS only, HSTS).
# Certificates: ./certs/fullchain.pem and ./certs/privkey.pem (mounted, never committed).
# Hosting and domain are undecided, so server_name is a catch-all and the app's ALLOWED_HOSTS /
# CSRF_TRUSTED_ORIGINS decide which hosts are accepted.

gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_min_length 1024;
server_tokens off;

# Only this cert-free health path is served over plain HTTP (for load balancers / uptime checks).
server {
  listen 80 default_server;
  server_name _;
  location = /api/v1/health/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Product photos: a form can send several files of up to 5 MB each in one request (WEB-09).
  client_max_body_size 30m;

  error_page 502 503 504 /maintenance.html;
  location = /maintenance.html { root /usr/share/nginx/html; internal; }

  location /api/ {
    proxy_hide_header Strict-Transport-Security;  # Django sends its own; avoid a duplicate header
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location /static/ { alias /static/; expires 30d; add_header Cache-Control "public, immutable"; }
  # Uploaded originals never change in place; Nuxt Image serves resized WebP copies of them.
  location /media/  { alias /media/; expires 30d; add_header Cache-Control "public"; }
  location /_nuxt/  {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
