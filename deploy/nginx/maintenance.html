<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back in a moment</title>
<style>
  /* Static fallback served by nginx when the app is down: it cannot use the theme tokens, so it
     sticks to neutral system colours. */
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;background:Canvas;color:CanvasText;text-align:center}
  main{max-width:32rem;padding:2rem}
  h1{font-weight:500;font-size:2.2rem;margin:0 0 .5rem}
  p{font-family:system-ui,sans-serif;line-height:1.5;opacity:.8}
</style>
</head>
<body>
<main>
  <h1>We’ll be right back</h1>
  <p>The shop is briefly unavailable while we make an update. Please try again in a few minutes.</p>
</main>
</body>
</html>
